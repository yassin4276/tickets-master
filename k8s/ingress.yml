apiVersion: networking.k8s.io/v1
kind : Ingress
metadata :
  name : ticketing-ingress
  namespace : ticketing
spec:
  ingressClassName: nginx
  rules:
    - host: ticketing.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ticketing-api
                port:
                  number: 8080
